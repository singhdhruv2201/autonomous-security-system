[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helio-simulator"
version = "0.1.0"
description = "Synthetic company directory for the Helio security simulator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "neo4j>=5.26,<6",
    "langchain[anthropic,mcp]",
    "langgraph-checkpoint-sqlite",
    "slack-bolt",
    "aiohttp",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helio_dashboard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["neo4j: requires a running Neo4j instance and NEO4J_TEST_URI"]
