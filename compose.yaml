name: helio-simulator
services:
  simulator:
    build: .
    image: helio-simulator:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - company-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  crm:
    build: .
    image: helio-simulator:local
    command: ["uvicorn", "helio_crm.api:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      CRM_DB_PATH: /data/crm.sqlite3
      HELIO_DIRECTORY_URL: http://simulator:8000
      CRM_ADMIN_TOKEN: ${CRM_ADMIN_TOKEN:?Run make setup first}
      CRM_MAYA_TOKEN: ${CRM_MAYA_TOKEN:?Run make setup first}
      CRM_AGENT_TOKEN: ${CRM_AGENT_TOKEN:?Run make setup first}
      CRM_OBSERVER_TOKEN: ${CRM_OBSERVER_TOKEN:?Run make setup first}
    depends_on:
      simulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - crm-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  sales-agent:
    image: helio-simulator:local
    profiles: ["demo"]
    command: ["python", "-m", "helio_crm.agent"]
    environment:
      CRM_URL: http://crm:8001
      CRM_AGENT_TOKEN: ${CRM_AGENT_TOKEN:?Run make setup first}
    depends_on:
      crm:
        condition: service_healthy
    read_only: true
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run make setup first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - security-graph-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
  graph-sync:
    image: helio-simulator:local
    profiles: ["tools"]
    command: ["python", "-m", "helio_security.cli", "sync"]
    environment:
      HELIO_DIRECTORY_URL: http://simulator:8000
      CRM_URL: http://crm:8001
      CRM_OBSERVER_TOKEN: ${CRM_OBSERVER_TOKEN:?Run make setup first}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run make setup first}
    depends_on:
      simulator:
        condition: service_healthy
      crm:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    read_only: true
volumes:
  company-data:
  crm-data:
  security-graph-data:
