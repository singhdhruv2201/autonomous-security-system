name: helio-simulator
services:
  simulator:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - company-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  company-data:
