name: Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-synthetic-password
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget --spider --quiet http://localhost:7474/"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      NEO4J_TEST_URI: bolt://127.0.0.1:7687
      NEO4J_PASSWORD: ci-synthetic-password
      ANTHROPIC_API_KEY: ""
      SLACK_BOT_TOKEN: ""
      SLACK_APP_TOKEN: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
      - name: Backend and Neo4j integration checks
        run: make test
      - name: Showcase checks
        if: ${{ !cancelled() }}
        run: make test-showcase
      - name: Dashboard JavaScript checks
        if: ${{ !cancelled() }}
        run: make test-ui
